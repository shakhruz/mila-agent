name: tests
on: [push, pull_request]
permissions: { contents: read }   # least-privilege CI token, also for pull requests from forks
jobs:
  run_all:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # a run once hung on apt-get for 30+ min; without a limit GitHub waits up to 6 h
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: oven-sh/setup-bun@v2
      - run: for i in 1 2 3; do timeout 150 sudo apt-get update -qq && timeout 150 sudo apt-get install -y -qq ffmpeg fonts-dejavu-core && exit 0; sudo dpkg --configure -a || true; sleep 10; done; exit 1   # a stuck apt mirror: retry instead of waiting; finish an interrupted dpkg before retrying
        timeout-minutes: 16   # worst case 3×(150+150)+2×10 = 920 s < 960
      - run: pip install pyyaml pillow numpy telethon==1.45.0   # telethon: owner-telegram tests; without it a test reports 0/0, which CI treats as a failure
      - run: HOME=$(mktemp -d) bash tests/run_all.sh   # every test_* in the repo + frontmatter, sandboxed HOME
      - name: privacy-lint — no maintainers' private values in the core (the list is the PRIVACY_JSON secret, never in the tree; skipped without it)
        env: { PRIVACY_LIST: "${{ secrets.PRIVACY_JSON }}" }
        run: |
          if [ -z "$PRIVACY_LIST" ]; then echo "no PRIVACY_JSON secret (fork or PR) — skipped"; exit 0; fi
          umask 077; printf '%s' "$PRIVACY_LIST" > "$RUNNER_TEMP/privacy.json"
          PRIVACY_JSON="$RUNNER_TEMP/privacy.json" python3 tools/privacy_lint.py --all
