# Mila Agent — one container. «Deploy to Hostinger» reads this file by its raw GitHub link.
# Fill the variables in your Docker panel (or a .env file next to this one). Nothing secret lives in this file.
services:
  mila:
    image: mila-agent:local   # built on your server from the public repository (no registry needed)
    build:
      context: https://github.com/shakhruz/mila-agent.git#main
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      BIRTH_CODE: ${BIRTH_CODE:-}                             # one-time code from the MILAGPT bot: the bot token comes by itself
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}      # from @BotFather; empty → the log says what to do
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}   # optional: empty → write /start to your bot and sign in to Claude from the chat
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}               # or an API key from console.anthropic.com
      OWNER_ID: ${OWNER_ID:-}                                 # optional: your Telegram id; empty → a pairing code in the log
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}             # optional: cheap tasks on open models (openrouter.ai/keys)
      GROQ_API_KEY: ${GROQ_API_KEY:-}                         # optional: Mila hears voice messages (console.groq.com/keys)
      TZ: ${TZ:-UTC}
    volumes:
      - mila-home:/home/agent     # memory, skills, journal, the bot's state — survives updates
    # No ports: Mila talks to Telegram outward only; nothing listens on the internet.
volumes:
  mila-home:
