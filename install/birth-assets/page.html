<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Mila · Birth</title><style>
:root{--bg:#0b2f2c;--mint:#5eead4;--sand:#d4a574;--ink:#eafaf6;--mut:#9cc9c1;--bad:#ffb4a8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(1200px 700px at 50% -10%,#1b6a63,var(--bg) 60%);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:28px 16px 40px}
.bar{font:13px ui-monospace,Menlo,monospace;color:var(--mut);background:#08221f;border:1px solid #1d5a54;border-radius:999px;padding:7px 14px;margin-bottom:26px}
.card{width:100%;max-width:520px;background:rgba(255,255,255,.05);border:1px solid rgba(94,234,212,.22);border-radius:26px;padding:30px 26px;text-align:center}
.av{width:150px;height:150px;border-radius:50%;object-fit:cover;border:3px solid var(--mint);box-shadow:0 0 0 10px rgba(94,234,212,.10),0 0 60px rgba(94,234,212,.35);margin:4px auto 18px;display:block;transition:all .8s}
.av.sleep{filter:grayscale(1) brightness(.55);box-shadow:none;border-color:#2a6b64}
h1{font:600 30px/1.2 Georgia,serif;margin:0 0 8px}p{margin:0 0 16px;color:var(--mut)}
.step{display:none}.step.on{display:block;animation:in .5s}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
button,a.btn{display:block;font:600 17px inherit;border:0;border-radius:14px;padding:14px 20px;cursor:pointer;width:100%;margin-top:10px;text-decoration:none}
button:disabled{opacity:.5;cursor:default}
.pri{background:var(--mint);color:#06302b}
input{width:100%;font:16px ui-monospace,Menlo,monospace;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:#08221f;color:var(--ink);text-align:center}
.dots{display:flex;gap:8px;justify-content:center;margin:0 0 18px}.dots i{width:34px;height:4px;border-radius:4px;background:rgba(255,255,255,.18)}.dots i.a{background:var(--mint)}
.code{font:700 34px ui-monospace,Menlo,monospace;letter-spacing:6px;color:var(--sand);margin:10px 0 14px}
.cert{border:1px solid var(--sand);border-radius:16px;padding:14px;margin:14px 0;color:var(--ink)}.cert b{color:var(--sand)}
.lang{display:flex;gap:6px;margin:-12px 0 18px}.lang button{width:auto;margin:0;padding:6px 12px;font:600 13px inherit;border-radius:999px;background:transparent;color:var(--mut);border:1px solid rgba(255,255,255,.2)}.lang button.a{background:var(--mint);color:#06302b;border-color:var(--mint)}
.msg{min-height:1.5em;margin:12px 0 0;font-size:15px;color:var(--mut)}.msg.err{color:var(--bad)}.msg.ok{color:var(--mint)}
.note{font-size:13px;color:var(--mut);margin-top:22px;max-width:520px;text-align:center}
</style></head><body>
<div class="bar" id="bar">mila.localhost</div><div class="lang"><button data-l="en">EN</button><button data-l="ru">RU</button><button data-l="uz">UZ</button><button data-l="zh">中文</button></div>

<div class="step" id="s2"><div class="dots"><i class="a"></i><i class="a"></i><i></i></div><h1 data-i="t2"></h1><p data-i="p2"></p><button class="pri" id="b2" data-i="b2"></button><div class="msg" id="m2"></div></div>

</div>

<script>

>","certn":"<br>Её человек: <b>%n</b>","closed":"Эта страница своё дело сделала — её можно закрыть."},

<b>%d</b><br>şu kompyuterda<br>Ovozi: <b>@%u</b>","certn":"<br>Uning odami: <b>%n</b>","closed":"Sahifa öz işini qildi. Uni yopsangiz böladi."},
"zh":{"t0":"一位 Mila 即将诞生","p0":"她的家已在这台电脑上准备好。接下来的一切都在这个页面完成。","b0":"✦ 让新的 Mila 诞生","t1":"声音","p1":"Mila 需要一个 Telegram 机器人 — 那是她的声音。","h1":"在 Telegram 里打开 @BotFather，发送 /newbot，取一个名字。它会回复一长串令牌，把它粘贴到这里。","b1":"继续","t2":"心智","p2":"在 Anthropic 官方页面用您自己的订阅登录 Claude。Mila 看不到您的登录信息。","b2":"打开 Anthropic 登录页","t3":"您","p3":"在 Telegram 里把这个词发给您的机器人，她就知道真的是您。","b3":"已发送","t4":"Mila 诞生了 ✨","p4":"她在 Telegram 等您，已经想知道您的名字。这个页面已完成使命并将关闭：其余一切都在聊天里进行。","b4":"打开 Telegram — 她在等您","note":"这个页面只存在于您的电脑上，只能使用一次。","e_format":"这不像机器人令牌。它应形如 1234567890:AA… — 请完整复制 @BotFather 给的那一行。","e_tg":"Telegram 不接受这个令牌。请确认复制完整，或向 @BotFather 要一个新的（/token）。","e_net":"这台电脑现在连不上 Telegram。请检查网络后重试。","e_srv":"这台电脑上出了点问题。请关闭此页面，再运行 mila birth。","ok1":"她的声音准备好了：@%s","w2":"正在等您在 Anthropic 页面完成登录…","e_cm":"这台电脑上找不到 Claude Code。请先安装，然后刷新本页。","e_cn":"还没有登录。请在 Anthropic 页面完成登录 — 本页会自动发现。","ok2":"已登录 ✓","sendto":"作为私信发给 @%s。","w3":"正在等您的消息…","e_nocode":"还没有收到代码。请把它作为私信发给您的机器人。","e_conflict":"有别的程序正在读取这个机器人（Claude Code 会话或接收服务）。请先关闭它一分钟，再点按钮。","e_webhook":"这个机器人设置了 webhook，无法在这里读取。请先移除 webhook 再试。","cert":"出生于 <b>%d</b><br>就在这台电脑上<br>她的声音：<b>@%u</b>","certn":"<br>她的人：<b>%n</b>","closed":"这个页面已完成使命，可以关闭了。"}};
const $=id=>document.getElementById(id);
let lang="en",st={},pairTimer=null,loginTimer=null,botName="",born=null,msgKey={};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function tr(k,v){return (T[lang][k]||T.en[k]||k).replace("%s",v==null?"":v)}
function say(id,key,cls,v){msgKey[id]=[key,cls,v];paintMsg(id)}
function paintMsg(id){const m=msgKey[id],e=$(id);if(!m||!m[0]){e.textContent="";e.className="msg";return}e.textContent=tr(m[0],m[2]);e.className="msg "+(m[1]||"")}
function paintCert(){if(!born)return;let d="";try{d=new Date(born.born_at).toLocaleString(lang==="zh"?"zh-CN":lang==="uz"?"uz-UZ":lang,{dateStyle:"long",timeStyle:"short"})}catch(e){d=born.born_at}
 let h=tr("cert").replace("%d",esc(d)).replace("%u",esc(born.bot_username||""));if(born.owner_first_name)h+=tr("certn").replace("%n",esc(born.owner_first_name));$("cert").innerHTML=h}
function L(l){lang=l;document.documentElement.lang=l;document.querySelectorAll("[data-i]").forEach(e=>e.textContent=T[l][e.dataset.i]);document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("a",b.dataset.l==l));
 Object.keys(msgKey).forEach(paintMsg);if(botName)$("sendto").textContent=tr("sendto",botName);paintCert();try{localStorage.setItem("mila-l",l)}catch(e){}}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>L(b.dataset.l));
function go(n){document.querySelectorAll(".step").forEach(s=>s.classList.remove("on"));$("s"+n).classList.add("on");$("av").classList.toggle("sleep",n!==4)}
async function api(path,body){try{const r=await fetch("api/"+path,body===undefined?{cache:"no-store"}:{method:"POST",cache:"no-store",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});return await r.json()}catch(e){return {ok:false,error:"srv"}}}
function errKey(e){return {format:"e_format",telegram:"e_tg",network:"e_net",claude_missing:"e_cm",claude_not:"e_cn",no_code:"e_nocode",conflict:"e_conflict",webhook:"e_webhook"}[e]||"e_srv"}
async function refresh(){const s=await api("status");if(s&&s.token){st=s}return s}
async function next(){const s=await refresh();if(!s.token)return say("m0","e_srv","err");if(!st.token.done)return enter1();if(!st.claude.done)return enter2();if(!st.pair.done)return enter3();return enter4()}
function enter1(){go(1);$("tok").focus()}
$("b0").onclick=next;
$("b1").onclick=async()=>{const v=$("tok").value.trim();say("m1","");$("b1").disabled=true;const r=await api("token",{token:v});$("b1").disabled=false;$("tok").value="";
 if(!r.ok){say("m1",errKey(r.error),"err");return}say("m1","ok1","ok",r.username);setTimeout(next,700)};
async function enter2(){go(2);const r=await api("claude");if(r.done){say("m2","ok2","ok");return setTimeout(next,500)}if(r.error==="claude_missing")say("m2","e_cm","err")}
$("b2").onclick=async()=>{const r=await api("claude/login",{});if(!r.ok){say("m2",errKey(r.error),"err");return}say("m2","w2","");
 clearInterval(loginTimer);loginTimer=setInterval(async()=>{const c=await api("claude");if(c.done){clearInterval(loginTimer);say("m2","ok2","ok");setTimeout(next,600)}else if(c.error==="claude_missing"){clearInterval(loginTimer);say("m2","e_cm","err")}},2500)};
async function enter3(){go(3);const r=await api("pair/start",{});if(!r.ok){say("m3",errKey(r.error),"err");return}if(r.done)return enter4();
 $("code").textContent=r.code;botName=r.username||"";$("sendto").textContent=tr("sendto",botName);say("m3","w3","");clearInterval(pairTimer);pairTimer=setInterval(()=>pollPair(false),2000)}
async function pollPair(manual){const r=await api("pair/poll");if(r.paired){clearInterval(pairTimer);return enter4()}
 if(r.error==="conflict"||r.error==="webhook"){clearInterval(pairTimer);say("m3",errKey(r.error),"err")}else if(manual){say("m3","e_nocode","err")}else say("m3","w3","")}
$("b3").onclick=()=>pollPair(true);
async function enter4(){const r=await api("born",{});if(!r.ok){say("m3",errKey(r.error),"err");return}born=r.record;paintCert();go(4);
 $("b4").href="https://t.me/"+encodeURIComponent(born.bot_username||"")}
$("b4").onclick=()=>{api("done",{});say("m4","closed","ok");setTimeout(()=>{try{window.close()}catch(e){}},1500)};
let l0="en";try{l0=localStorage.getItem("mila-l")||(navigator.language||"en").slice(0,2)}catch(e){l0=(navigator.language||"en").slice(0,2)}
L(T[l0]?l0:"en");$("bar").textContent=location.hostname;
</script></body></html>
