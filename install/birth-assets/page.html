function say(id,key,cls,v){msgKey[id]=[key,cls,v];paintMsg(id)}
function paintMsg(id){const m=msgKey[id],e=$(id);if(!m||!m[0]){e.textContent="";e.className="msg";return}e.textContent=tr(m[0],m[2]);e.className="msg "+(m[1]||"")}
function paintCert(){if(!born)return;let d="";try{d=new Date(born.born_at).toLocaleString(lang==="zh"?"zh-CN":lang==="uz"?"uz-UZ":lang,{dateStyle:"long",timeStyle:"short"})}catch(e){d=born.born_at}
 let h=tr("cert").replace("%d",esc(d)).replace("%u",esc(born.bot_username||""));if(born.owner_first_name)h+=tr("certn").replace("%n",esc(born.owner_first_name));$("cert").innerHTML=h}
function L(l){lang=l;document.documentElement.lang=l;$("bone").href="https://t.me/__PARENT__?start=birth_"+l+"___BIND__";document.querySelectorAll("[data-i]").forEach(e=>e.textContent=T[l][e.dataset.i]);document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("a",b.dataset.l==l));
 Object.keys(msgKey).forEach(paintMsg);if(typeof paintWake==="function")paintWake();if(botName)$("sendto").textContent=tr("sendto",botName);paintCert();try{localStorage.setItem("mila-l",l)}catch(e){}}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>L(b.dataset.l));
function go(n){document.querySelectorAll(".step").forEach(s=>s.classList.remove("on"));$("s"+n).classList.add("on");$("av").classList.toggle("born",n===4)}
async function api(path,body){try{const r=await fetch("api/"+path,body===undefined?{cache:"no-store"}:{method:"POST",cache:"no-store",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});return await r.json()}catch(e){return {ok:false,error:"srv"}}}
function errKey(e){return {format:"e_format",telegram:"e_tg",network:"e_net",claude_missing:"e_cm",claude_not:"e_cn",no_code:"e_nocode",conflict:"e_conflict",webhook:"e_webhook",code_format:"e_code_format",code_refused:"e_code_refused",relay:"e_relay",relay_no_token:"e_relay_no_token"}[e]||"e_srv"}
async function refresh(){const s=await api("status");if(s&&s.token){st=s}return s}
async function next(){const s=await refresh();if(!s.token)return say("m0","e_srv","err");if(!st.token.done)return enter1();if(!st.pair.done)return enter3();return enter4()}   /* her mind is connected from the chat, not here */
function enter1(){go(1)}
/* No code to copy: after the tap the page asks its own server for the key every 2 s; a minute of nothing — a hint about the code */
let botTimer=null;
$("bone").addEventListener("click",()=>{if(botTimer)return;const t0=Date.now();say("m1","w_bot","");
 botTimer=setInterval(async()=>{let r={};try{r=await api("collect",{})}catch(e){}
  if(r.ok){clearInterval(botTimer);botTimer=null;say("m1","ok1","ok",r.username);setTimeout(next,700)}
  else if(Date.now()-t0>600000){clearInterval(botTimer);botTimer=null}
  else if(Date.now()-t0>60000&&msgKey.m1&&msgKey.m1[0]==="w_bot")say("m1","w_bot_late","")},2000)});
$("b0").onclick=next;
$("bgo").onclick=async()=>{const v=$("pasted").value.trim(),k=kind(v);say("m1","");if(!k){say("m1","e_input","err");return}
 $("bgo").disabled=true;const r=await api(k,k==="code"?{code:v}:{token:v});$("bgo").disabled=false;$("pasted").value="";
 if(!r.ok){say("m1",errKey(r.error),"err");return}say("m1","ok1","ok",r.username);setTimeout(next,700)};
function kind(v){if(/^\d{5,}:[A-Za-z0-9_-]{30,}$/.test(v))return "token";const c=v.replace(/[^A-Za-z0-9]/g,"").toUpperCase();
 if(/^(MILA)?[A-Z2-9]{12}$/.test(c))return "code";return ""}
async function enter2(){go(2);const r=await api("claude");if(r.done){say("m2","ok2","ok");return setTimeout(next,500)}if(r.error==="claude_missing")say("m2","e_cm","err")}
$("b2").onclick=async()=>{const r=await api("claude/login",{});if(!r.ok){say("m2",errKey(r.error),"err");return}say("m2","w2","");
 clearInterval(loginTimer);loginTimer=setInterval(async()=>{const c=await api("claude");if(c.done){clearInterval(loginTimer);say("m2","ok2","ok");setTimeout(next,600)}else if(c.error==="claude_missing"){clearInterval(loginTimer);say("m2","e_cm","err")}},2500)};
async function enter3(){go(3);const r=await api("pair/start",{});if(!r.ok){say("m3",errKey(r.error),"err");return}if(r.done)return enter4();
 $("code").textContent=r.code;botName=r.username||"";$("sendto").textContent=tr("sendto",botName);
 $("bopen").href="https://t.me/"+encodeURIComponent(botName)+"?start="+encodeURIComponent(r.code);
 say("m3","w3","");clearInterval(pairTimer);pairTimer=setInterval(()=>pollPair(false),2000)}
async function pollPair(manual){const r=await api("pair/poll");if(r.paired){clearInterval(pairTimer);return enter4()}
 if(r.error==="conflict"||r.error==="webhook"){clearInterval(pairTimer);say("m3",errKey(r.error),"err")}else if(manual){say("m3","e_nocode","err")}else say("m3","w3","")}
$("b3").onclick=()=>pollPair(true);
let wakeKey="wake",wakeTimer=null;
function paintWake(){$("p4").textContent=tr(wakeKey)}
async function enter4(){const r=await api("born",{lang:lang});if(!r.ok){say("m3",errKey(r.error),"err");return}born=r.record;paintCert();go(4);
 $("b4").href="https://t.me/"+encodeURIComponent(born.bot_username||"");celebrate();
 /* «she is waiting» is said only after her first words have really left */
 const t0=Date.now();clearInterval(wakeTimer);wakeTimer=setInterval(async()=>{let a={};try{a=await api("awake")}catch(e){}
  if(a.greeted){clearInterval(wakeTimer);wakeKey="p4";paintWake()}else if(Date.now()-t0>90000){clearInterval(wakeTimer);wakeKey="wake_late";paintWake()}},1500)}
$("b4").onclick=()=>{api("done",{});say("m4","closed","ok");setTimeout(()=>{try{window.close()}catch(e){}},1500)};
function celebrate(){if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 const c=$("fx"),x=c.getContext("2d"),dpr=window.devicePixelRatio||1;c.width=innerWidth*dpr;c.height=innerHeight*dpr;x.scale(dpr,dpr);
 const cols=["#5eead4","#0f766e","#d4a574","#f4978e"],P=[];
 for(let i=0;i<150;i++){const burst=i%2,a=Math.random()*Math.PI*2,v=burst?4+Math.random()*7:2+Math.random()*5;
  P.push({x:innerWidth*(burst?.5:Math.random()),y:burst?innerHeight*.35:-10,vx:burst?Math.cos(a)*v:(Math.random()-.5)*2,vy:burst?Math.sin(a)*v-2:v,r:3+Math.random()*4,c:cols[i%4],rot:Math.random()*6,vr:(Math.random()-.5)*.3,sq:Math.random()<.5})}
 const t0=performance.now();(function f(t){const k=(t-t0)/2800;x.clearRect(0,0,innerWidth,innerHeight);if(k>=1)return;
  P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.vx*=.99;p.rot+=p.vr;x.save();x.globalAlpha=Math.max(0,1-k*k);x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle=p.c;
   if(p.sq)x.fillRect(-p.r,-p.r/2,p.r*2,p.r);else{x.beginPath();x.arc(0,0,p.r/1.5,0,7);x.fill()}x.restore()});requestAnimationFrame(f)})(t0)}
let l0="en";try{l0=localStorage.getItem("mila-l")||(navigator.language||"en").slice(0,2)}catch(e){l0=(navigator.language||"en").slice(0,2)}
L(T[l0]?l0:"en");$("bar").textContent=location.hostname;
</script></body></html>
